[build]
  command = "npm run build"
  publish = "dist"
  # Skip documentation-only changes. Missing history/errors continue the build.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)README.md' ':(exclude)docs/images/**'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
